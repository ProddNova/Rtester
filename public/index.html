<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>AutoHunter</title>
  <meta name="description" content="Annunci di auto usate da AutoScout24, AutoSuperMarket, Automobile.it e Trovit in un'unica lista, senza doppioni.">
  <meta name="theme-color" content="#0f0f0e">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AutoHunter">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <button class="back" id="btnBack" aria-label="Indietro" data-icon="chevron-left" hidden></button>
    <a class="brand" href="#/" id="brand" data-icon="crosshair"><span class="word"><b>Auto</b><i>Hunter</i></span></a>
    <div class="top-title" id="topTitle"></div>
    <nav class="top-actions">
      <a class="ibtn" href="#/" id="navSearch" aria-label="Home" data-icon="house"></a>
      <a class="ibtn" href="#/salvati" id="navSaved" aria-label="Salvati" data-icon="star"><b class="count" id="savedCount" hidden>0</b></a>
    </nav>
  </header>

  <!-- ================= HOME: ricerca rapida + feed ================= -->
  <main id="view-search" class="view">
    <form id="searchForm" autocomplete="off" class="quick card">
      <div class="grid2">
        <label>Marca<span class="combo"><input name="make" id="fMake" type="text" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="next" placeholder="Tutte"><button type="button" class="clear" tabindex="-1" aria-label="Cancella" data-icon="x"></button></span></label>
        <label>Modello<span class="combo"><input name="model" id="fModel" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="Prima la marca" disabled><button type="button" class="clear" tabindex="-1" aria-label="Cancella" data-icon="x"></button></span></label>
        <label>Prezzo fino a<select name="pmax" data-list="price"><option value="">Qualsiasi</option></select></label>
        <label>Anno da<select name="ymin" data-list="year"><option value="">Qualsiasi</option></select></label>
      </div>
      <div class="quick-actions">
        <button type="button" class="sbtn ghost" id="btnMore" data-icon="sliders-horizontal">Altri filtri<b class="count" id="moreCount" hidden>0</b></button>
        <button type="submit" class="sbtn" data-icon="search">Cerca</button>
      </div>

      <!-- altri filtri: pannello che sale dal basso -->
      <div class="adv" id="adv" hidden>
        <div class="adv-panel">
          <div class="sheet-title"><h2>Altri filtri</h2><button type="button" class="ibtn sm" id="btnAdvClose" aria-label="Chiudi" data-icon="x"></button></div>
          <div class="grid2">
            <label class="span2">Versione / parole chiave<input name="kw" type="text" maxlength="40" placeholder="es. GTI, Aero, Quattro, Vector" autocapitalize="off"></label>
            <label>Prezzo da<select name="pmin" data-list="price"><option value="">Qualsiasi</option></select></label>
            <label>Anno fino a<select name="ymax" data-list="year"><option value="">Qualsiasi</option></select></label>
            <label>Km da<select name="kmmin" data-list="km"><option value="">Qualsiasi</option></select></label>
            <label>Km fino a<select name="kmmax" data-list="km"><option value="">Qualsiasi</option></select></label>
            <label>Alimentazione<select name="fuel" id="fFuel"><option value="">Tutte</option></select></label>
            <label>Cambio<select name="gear" id="fGear"><option value="">Tutti</option></select></label>
            <label>Carrozzeria<select name="body" id="fBody"><option value="">Tutte</option></select></label>
            <label>Venditore<select name="seller"><option value="">Tutti</option><option value="privato">Privati</option><option value="concessionario">Concessionari</option></select></label>
            <label>Potenza da (CV)<input name="cvmin" type="number" inputmode="numeric" min="0" placeholder="CV"></label>
            <label>Potenza fino a (CV)<input name="cvmax" type="number" inputmode="numeric" min="0" placeholder="CV"></label>
            <label class="span2">Dove cercare<select name="area" id="fArea">
              <option value="eu">Italia + estero (Germania, Olanda, Francia…)</option>
              <option value="it">Solo Italia</option>
              <option value="estero">Solo estero</option>
            </select></label>
            <label>Distanza da Genova<select name="radius">
              <option value="">Qualsiasi</option><option value="25">Entro 25 km</option><option value="50">Entro 50 km</option>
              <option value="100">Entro 100 km</option><option value="150">Entro 150 km</option><option value="200">Entro 200 km</option>
              <option value="300">Entro 300 km</option>
            </select></label>
            <label>Regione<select name="region" id="fRegion"><option value="">Tutta Italia</option></select></label>
          </div>
          <div class="sheet-actions">
            <button type="button" class="sbtn ghost" id="btnReset">Azzera tutto</button>
            <button type="submit" class="sbtn">Cerca</button>
          </div>
        </div>
      </div>
    </form>

    <!-- scorciatoie e ricerche fatte: due blocchi con titolo, una riga ciascuno -->
    <section class="block">
      <h3 class="block-title">Scorciatoie</h3>
      <div class="chips-row" id="quickChips"></div>
    </section>
    <section class="block" id="blockMine" hidden>
      <h3 class="block-title">Le tue ricerche</h3>
      <div class="chips-row"><span class="contents" id="savedSearches"></span><span class="contents" id="recentSearches"></span></div>
    </section>

    <!-- feed: titolo, scelta del tipo, filtri compatti -->
    <section class="feed-sec">
      <div class="sec-head">
        <h2>Da scoprire</h2>
        <button class="ibtn sm shuffle" id="btnFeedRefresh" type="button" aria-label="Mescola" title="Mescola" data-icon="shuffle"></button>
      </div>
      <div class="seg" id="feedMode" role="tablist" aria-label="Cosa mostrare">
        <button type="button" data-mode="mix" data-icon="gem">Consigliati</button>
        <button type="button" data-mode="recenti" data-icon="clock">Più recenti</button>
      </div>
      <div class="pills">
        <label class="pill"><select id="feedPmax" data-list="price" aria-label="Prezzo massimo"><option value="">Prezzo: tutti</option></select></label>
        <label class="pill"><select id="feedKm" data-list="km" aria-label="Km massimi"><option value="">Km: tutti</option></select></label>
        <label class="pill"><select id="feedArea" aria-label="Dove"><option value="eu">Ovunque</option><option value="it">Solo Italia</option></select></label>
      </div>
    </section>
    <div id="feed" class="feed"></div>
    <div id="feedMore" class="more"></div>
  </main>

  <!-- ================= RISULTATI ================= -->
  <main id="view-results" class="view">
    <div class="res-bar">
      <a class="summary" href="#/" id="summary" title="Modifica ricerca"></a>
      <button class="ibtn sm" id="btnSaveSearch" aria-label="Salva ricerca" data-icon="bookmark"></button>
    </div>
    <div class="res-head">
      <span id="resInfo"></span>
    </div>
    <div class="sort-row">
      <label>Ordina<select id="sort">
        <option value="rilevanza">Misti</option>
        <option value="vicini">Più vicini</option>
        <option value="affari">Affari prima</option>
        <option value="prezzo">Prezzo più basso</option>
        <option value="prezzo_desc">Prezzo più alto</option>
        <option value="km">Meno km</option>
        <option value="anno">Più nuove</option>
        <option value="recenti">Più recenti</option>
      </select></label>
      <label>Poi<select id="sort2">
        <option value="">—</option>
        <option value="prezzo">Prezzo più basso</option>
        <option value="vicini">Più vicini</option>
        <option value="affari">Affari prima</option>
        <option value="km">Meno km</option>
        <option value="anno">Più nuove</option>
        <option value="recenti">Più recenti</option>
      </select></label>
    </div>
    <div id="sources" class="sources"></div>
    <div id="results" class="list"></div>
    <div id="more" class="more"></div>
  </main>

  <!-- ================= ANNUNCIO ================= -->
  <main id="view-ad" class="view"></main>

  <!-- ================= SALVATI ================= -->
  <main id="view-saved" class="view">
    <div class="board-head">
      <h2>Salvati</h2>
      <select id="savedSort" aria-label="Ordina salvati">
        <option value="nuovi">Ultimi salvati</option>
        <option value="prezzo">Prezzo più basso</option>
        <option value="calo">Prezzo sceso</option>
      </select>
    </div>
    <div id="storeWarn" class="alert" hidden></div>
    <div class="addrow">
      <input id="addUrl" type="url" inputmode="url" placeholder="Incolla un link (anche Subito o Marketplace)" autocomplete="off">
      <button class="sbtn" id="btnAdd">Aggiungi</button>
    </div>
    <div id="addMsg" class="addmsg" hidden></div>
    <div class="board-tools">
      <span class="muted" id="savedInfo"></span>
      <button class="link" id="btnCheck" data-icon="refresh-cw">Controlla prezzi</button>
    </div>
    <div id="saved" class="list"></div>

    <section class="banbox" id="banbox">
      <h2>Ban list</h2>
      <p class="muted">Modelli che non compaiono mai, né nelle ricerche né nella home. Vale per tutti. Le auto elettriche sono escluse sempre.</p>
      <div id="bans" class="chips"></div>
      <div class="banadd">
        <select id="banMake" aria-label="Marca"><option value="">Marca…</option></select>
        <select id="banModel" aria-label="Modello" disabled><option value="">Prima la marca</option></select>
        <button class="sbtn" id="btnBan" type="button" data-icon="ban">Banna</button>
      </div>
    </section>
  </main>

  <dialog id="dlg" class="sheet">
    <form method="dialog" class="sheet-body">
      <div class="sheet-title"><h2 id="dlgTitle"></h2><button class="ibtn sm" value="cancel" aria-label="Chiudi" data-icon="x"></button></div>
      <div id="dlgBody" class="dlg-text"></div>
      <div class="sheet-actions" id="dlgActions"></div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/models.js"></script>
  <script src="js/lang.js"></script>
  <script src="js/sites.js"></script>
  <script src="js/dedup.js"></script>
  <script src="js/match.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
