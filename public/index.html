<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CacciAuto</title>
  <meta name="description" content="Annunci di auto usate da AutoScout24, AutoSuperMarket e Automobile.it in un'unica lista, senza doppioni.">
  <meta name="theme-color" content="#0e1015">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CacciAuto">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <button class="brand" id="btnHome" aria-label="Vai alla ricerca">CacciAuto</button>
    <div class="top-actions">
      <button class="ibtn" id="btnRoulette" aria-label="Roulette">🎲</button>
      <button class="ibtn" id="btnBoard" aria-label="Bacheca">⭐<b class="count" id="boardCount" hidden>0</b></button>
      <button class="ibtn" id="btnHelp" aria-label="Aiuto">?</button>
    </div>
  </header>

  <!-- ================= RICERCA ================= -->
  <main id="view-search" class="view active">
    <div class="searchbar">
      <div class="sbox">
        <input id="q" type="search" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"
               placeholder="saab 9-3 diesel sotto 6k" aria-label="Cerca un'auto">
        <button class="sclear" id="clearQ" aria-label="Cancella" hidden>✕</button>
      </div>
      <button class="fbtn" id="btnFilters">Filtri<b class="count" id="filterCount" hidden>0</b></button>
    </div>
    <div id="suggest" class="suggest" hidden></div>
    <div class="chips-row" id="chips"></div>

    <div class="res-head">
      <span id="resInfo" class="muted">Scrivi un'auto o scegli un filtro</span>
      <select id="sort" aria-label="Ordina">
        <option value="rilevanza">Misti</option>
        <option value="prezzo">Prezzo ↑</option>
        <option value="km">Km ↑</option>
        <option value="recenti">Più recenti</option>
      </select>
    </div>
    <div id="sources" class="sources"></div>
    <div id="results" class="list"></div>
    <div id="more" class="more"></div>
  </main>

  <!-- ================= BACHECA ================= -->
  <main id="view-board" class="view">
    <div class="board-head">
      <h2>⭐ Bacheca</h2>
      <div class="seg" id="whoSeg" aria-label="Chi sei">
        <button data-who="a"></button><button data-who="b"></button>
      </div>
      <button class="ibtn sm" id="btnNames" aria-label="Cambia nomi">✏️</button>
    </div>
    <div class="addrow">
      <input id="addUrl" type="url" inputmode="url" placeholder="Incolla un link (anche Subito/Marketplace)" autocomplete="off">
      <button class="sbtn" id="btnAdd">Aggiungi</button>
    </div>
    <div id="addMsg" class="addmsg" hidden></div>
    <div class="board-tools">
      <select id="boardSort" aria-label="Ordina bacheca">
        <option value="nuovi">Ultime aggiunte</option>
        <option value="top">Più votate</option>
        <option value="prezzo">Prezzo ↑</option>
        <option value="km">Km ↑</option>
      </select>
      <button class="link" id="btnShareBoard">📤 Manda al socio</button>
      <button class="link" id="btnImport">📥 Importa</button>
    </div>
    <div id="board" class="list"></div>
    <button class="link danger center" id="btnClear">Svuota bacheca</button>
  </main>

  <!-- Filtri -->
  <dialog id="dlgFilters" class="sheet">
    <form method="dialog" class="sheet-body" id="filtersForm">
      <div class="sheet-title"><h2>Filtri</h2><button type="button" class="ibtn sm" data-close aria-label="Chiudi">✕</button></div>
      <div class="presets" id="presets"></div>
      <div class="grid2">
        <label>Prezzo da<input type="number" inputmode="numeric" name="pmin" placeholder="€"></label>
        <label>Prezzo a<input type="number" inputmode="numeric" name="pmax" placeholder="€"></label>
        <label>Anno dal<input type="number" inputmode="numeric" name="ymin" placeholder="es. 2005"></label>
        <label>Anno al<input type="number" inputmode="numeric" name="ymax" placeholder="es. 2012"></label>
        <label>Km massimi
          <select name="kmmax">
            <option value="">Qualsiasi</option><option value="50000">50.000</option><option value="100000">100.000</option>
            <option value="150000">150.000</option><option value="200000">200.000</option><option value="250000">250.000</option><option value="300000">300.000</option>
          </select>
        </label>
        <label>Alimentazione<select name="fuel" id="fFuel"><option value="">Tutte</option></select></label>
        <label>Cambio<select name="gear" id="fGear"><option value="">Tutti</option></select></label>
        <label>Carrozzeria<select name="body" id="fBody"><option value="">Tutte</option></select></label>
        <label>CV da<input type="number" inputmode="numeric" name="cvmin" placeholder="CV"></label>
        <label>CV a<input type="number" inputmode="numeric" name="cvmax" placeholder="CV"></label>
        <label class="span2">Zona<select name="region" id="fRegion"><option value="">Tutta Italia</option></select></label>
      </div>
      <label class="check"><input type="checkbox" name="europe"> Cerca anche all'estero (solo AutoScout24)</label>
      <p class="hint">La carrozzeria la filtra solo AutoScout24.</p>
      <div class="sheet-actions">
        <button type="button" class="sbtn ghost" id="btnResetFilters">Azzera</button>
        <button type="submit" class="sbtn" value="apply">Mostra annunci</button>
      </div>
    </form>
  </dialog>

  <!-- Roulette -->
  <dialog id="dlgRoulette" class="sheet">
    <div class="sheet-body">
      <div class="sheet-title"><h2>🎲 Roulette</h2><button class="ibtn sm" data-close aria-label="Chiudi">✕</button></div>
      <div class="slot" id="slot">
        <div class="slot-emoji" id="slotEmoji">🚗</div>
        <div class="slot-name" id="slotName">Pronti?</div>
        <div class="slot-meta" id="slotMeta">&nbsp;</div>
      </div>
      <p class="fact" id="slotFact"></p>
      <label class="check"><input type="checkbox" id="rouletteBudget"> Solo nel mio budget</label>
      <div class="sheet-actions">
        <button class="sbtn ghost" id="btnSpin">Rigira</button>
        <button class="sbtn" id="btnUseSpin" disabled>Cercala</button>
      </div>
    </div>
  </dialog>

  <!-- Generico -->
  <dialog id="dlgText" class="sheet">
    <form method="dialog" class="sheet-body">
      <div class="sheet-title"><h2 id="dlgTextTitle"></h2><button class="ibtn sm" value="cancel" aria-label="Chiudi">✕</button></div>
      <div id="dlgTextBody" class="dlg-text"></div>
      <div class="sheet-actions" id="dlgTextActions"></div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/sites.js"></script>
  <script src="js/parse.js"></script>
  <script src="js/dedup.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
