# Blueprint Render: un web service Node (gratis) che serve il sito e legge gli annunci.
# Su Render: New > Blueprint > scegli questo repo e il branch. Il resto lo fa da solo.
services:
  - type: web
    runtime: node
    name: cacciauto
    plan: free
    # Nessuna dipendenza vera: "npm run build" esegue i test.
    # Se un test fallisce il deploy si ferma e resta online la versione precedente.
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Database gratuito per i salvati condivisi (vedi README, "Salvati permanenti").
      # Render li chiede alla creazione: se li lasci vuoti l'app funziona lo stesso,
      # ma i salvati si cancellano a ogni riavvio del server.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
