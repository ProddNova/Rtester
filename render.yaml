# Blueprint Render: un web service Node (gratis) che serve il sito e legge gli annunci.
# Su Render: New > Blueprint > scegli questo repo e il branch. Il resto lo fa da solo.
services:
  - type: web
    runtime: node
    name: cacciauto
    plan: free
    # Nessuna dipendenza da installare: il build esegue solo i test.
    # Se un test fallisce il deploy si ferma e resta online la versione precedente.
    buildCommand: npm test
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
